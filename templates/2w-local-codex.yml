name: 2W Local Codex Relay

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to run as 2W workblock"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: 2w-local-codex-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare 2W workblock
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      issue_number: ${{ steps.gate.outputs.issue_number }}
      issue_title: ${{ steps.gate.outputs.issue_title }}
      issue_body_b64: ${{ steps.gate.outputs.issue_body_b64 }}
    steps:
      - name: Gate issue trigger
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const isDispatch = context.eventName === 'workflow_dispatch';
            const issueNumber = isDispatch ? Number(core.getInput('issue_number')) : context.payload.issue?.number;
            if (!issueNumber) {
              core.setOutput('should_run', 'false');
              return;
            }
            const { owner, repo } = context.repo;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            const hasReadyLabel = labels.includes('2w:ready');
            const hasReadyTitle = issue.title.startsWith('2W_READY:');
            const isClosed = issue.state !== 'open';
            const isAlreadyActive = labels.includes('2w:running') || labels.includes('2w:done');
            const runnable = issue.state === 'open' && !isAlreadyActive && (hasReadyLabel || hasReadyTitle);
            core.setOutput('should_run', runnable ? 'true' : 'false');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_title', issue.title || '');
            core.setOutput('issue_body_b64', Buffer.from(issue.body || '', 'utf8').toString('base64'));

  local_codex:
    name: Run local Codex CLI
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      changed_files: ${{ steps.diff.outputs.changed_files }}
      tests_status: ${{ steps.tests.outputs.tests_status }}
      codex_status: ${{ steps.codex.outputs.codex_status }}
    steps:
      - name: Mark issue running
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ needs.prepare.outputs.issue_number }}');
            const { owner, repo } = context.repo;
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: '2w:ready' }).catch(() => {});
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['2w:running'] }).catch(() => {});
            await github.rest.issues.createComment({ owner, repo, issue_number, body: '2W_RUNNING: local self-hosted runner started `codex exec`.' });

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify local Codex CLI login
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command codex -ErrorAction SilentlyContinue)) {
            Write-Error 'codex CLI not found on self-hosted runner PATH'
            exit 127
          }
          codex --version

      - name: Build Codex prompt
        shell: pwsh
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.prepare.outputs.issue_title }}
          ISSUE_BODY_B64: ${{ needs.prepare.outputs.issue_body_b64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .2w | Out-Null
          [System.IO.File]::WriteAllBytes('.2w/issue_body.md', [Convert]::FromBase64String($env:ISSUE_BODY_B64))
          $issueBody = Get-Content .2w/issue_body.md -Raw
          $template = @'
          # 2W Workblock

          You are Codex CLI running locally inside a self-hosted GitHub Actions runner.

          ## Repository

          __REPOSITORY__

          ## Mandatory constraints

          - Keep the change as small as possible.
          - Work only inside this repository checkout.
          - Do not print secrets, tokens, environment variables, browser session data, or credential-bearing config.
          - Do not create branches or pull requests.
          - Do not commit or push yourself; leave file changes in the working tree for the workflow.
          - If blocked, write BLOCKED to `.2w/codex_final_message.md`.
          - End by writing STATUS, CHANGED_FILES, TESTS, RISKS, NEXT to `.2w/codex_final_message.md`.

          ## Source issue

          Issue: #__ISSUE_NUMBER__
          Title: __ISSUE_TITLE__

          ## User workblock

          __ISSUE_BODY__
          '@
          $currentPrompt = $template.Replace('__REPOSITORY__', $env:GITHUB_REPOSITORY).Replace('__ISSUE_NUMBER__', $env:ISSUE_NUMBER).Replace('__ISSUE_TITLE__', $env:ISSUE_TITLE).Replace('__ISSUE_BODY__', $issueBody)
          Set-Content -Path .2w/current_prompt.md -Value $currentPrompt

      - name: Run local Codex CLI
        id: codex
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & codex exec --sandbox workspace-write --skip-git-repo-check --output-last-message .2w/codex_final_message.md (Get-Content .2w/current_prompt.md -Raw)
          $rc = $LASTEXITCODE
          "codex_status=$rc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not (Test-Path .2w/codex_final_message.md)) {
            @(
              'STATUS: FAILED'
              'CHANGED_FILES:'
              "TESTS: codex exec returned $rc before writing final message"
              'RISKS: local Codex CLI command, login, or flags may not match this runner'
              'NEXT: validate local codex exec command manually on the runner'
            ) | Set-Content .2w/codex_final_message.md
          }
          exit $rc

      - name: Collect changed files
        id: diff
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .2w | Out-Null
          $gitStatus = git status --short
          $gitStatus | Set-Content .2w/git_status.txt
          if (-not (Test-Path .2w/git_status.txt)) {
            Set-Content -Path .2w/git_status.txt -Value ''
          }
          $changedFiles = @(
            Get-Content .2w/git_status.txt | Where-Object { $_ -notmatch '^\?\? \.2w/' }
          )
          $changedFiles | Set-Content .2w/changed_files.txt
          if (-not (Test-Path .2w/changed_files.txt)) {
            Set-Content -Path .2w/changed_files.txt -Value ''
          }
          if ((Get-Item .2w/changed_files.txt).Length -gt 0) {
            "changed_files<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Get-Content .2w/changed_files.txt | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "changed_files=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Run repository checks when available
        id: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $status = 'not_configured'
          $rc = 0
          if (Test-Path package.json) {
            npm test --if-present
            $rc = $LASTEXITCODE
            if ($rc -eq 0) { $status = 'green:npm-test' } else { $status = "failed:npm-test:$rc" }
          } elseif ((Test-Path pyproject.toml) -or (Test-Path pytest.ini)) {
            python -m pytest
            $rc = $LASTEXITCODE
            if ($rc -eq 0) { $status = 'green:pytest' } else { $status = "failed:pytest:$rc" }
          } else {
            $status = 'not_configured:no-package-or-pytest'
            $rc = 0
          }
          "tests_status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit $rc

      - name: Commit and push changes
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -A
          git reset -- .2w
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "commit_sha=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          git commit -m "2W: issue #${{ needs.prepare.outputs.issue_number }}"
          git push origin HEAD:${{ github.ref_name }}
          "commit_sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  report_success:
    name: Report success
    needs: [prepare, local_codex]
    if: needs.prepare.outputs.should_run == 'true' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Comment result
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ needs.local_codex.outputs.commit_sha }}
          CHANGED_FILES: ${{ needs.local_codex.outputs.changed_files }}
          TESTS_STATUS: ${{ needs.local_codex.outputs.tests_status }}
          CODEX_STATUS: ${{ needs.local_codex.outputs.codex_status }}
        with:
          script: |
            const issue_number = Number('${{ needs.prepare.outputs.issue_number }}');
            const { owner, repo } = context.repo;
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: '2w:running' }).catch(() => {});
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['2w:done'] }).catch(() => {});
            const body = `2W_DONE\n\nrepo=${owner}/${repo}\nissue=#${issue_number}\ncommit=${process.env.COMMIT_SHA || 'none'}\ntests=${process.env.TESTS_STATUS || 'unknown'}\ncodex_exit_code=${process.env.CODEX_STATUS || 'unknown'}\n\nChanged files:\n\`\`\`text\n${process.env.CHANGED_FILES || 'none'}\n\`\`\`\n\nChatGPT instruction: Prüfe Commit/Diff über GitHub und starte den nächsten 2W-Block oder einen FIX-Block.`;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  report_failure:
    name: Report failure
    needs: [prepare, local_codex]
    if: needs.prepare.outputs.should_run == 'true' && failure()
    runs-on: ubuntu-latest
    steps:
      - name: Comment failure
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ needs.prepare.outputs.issue_number }}');
            const { owner, repo } = context.repo;
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: '2w:running' }).catch(() => {});
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['2w:failed'] }).catch(() => {});
            await github.rest.issues.createComment({ owner, repo, issue_number, body: '2W_FAILED: local Codex CLI workflow failed. Prüfe Runner-Logs, Codex PATH, lokalen Login und CLI-Flags.' });
