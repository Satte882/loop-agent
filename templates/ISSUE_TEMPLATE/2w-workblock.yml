name: 2W Workblock

description: Einfacher Arbeitsblock für ChatGPT → lokale Codex CLI → GitHub → ChatGPT

title: "2W_READY: "

labels:
  - 2w:ready

body:
  - type: markdown
    attributes:
      value: |
        Kurz halten. Ein Ziel, ein kleiner Arbeitsblock, ein prüfbares Ergebnis.
        Standardpfad: lokaler self-hosted Runner + lokale `codex exec`-Ausführung, ohne externen API-Schlüssel.

  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Was soll Codex konkret erledigen?
      placeholder: "Beispiel: Ergänze in README.md eine kurze Installationssektion für 2W."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Kontext und Grenzen
      description: Optional. Nur nennen, was Codex wissen oder nicht anfassen soll.
      placeholder: |
        Optional:
        - Nur README.md ändern
        - Keine neuen Tools
        - Keine Branches oder Pull Requests
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: Fertig wenn
      description: Optional. Woran erkennt ChatGPT später, dass der Block erledigt ist?
      placeholder: "Beispiel: README enthält die Sektion, Workflow bleibt unverändert, Issue-Kommentar enthält Commit-SHA."
    validations:
      required: false
