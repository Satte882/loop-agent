name: 2W Local Codex Relay

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to run as 2W workblock"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: 2w-local-codex-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare 2W workblock
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      issue_number: ${{ steps.gate.outputs.issue_number }}
      issue_title: ${{ steps.gate.outputs.issue_title }}
      issue_body_b64: ${{ steps.gate.outputs.issue_body_b64 }}
    steps:
      - name: Gate issue trigger
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const isDispatch = context.eventName === 'workflow_dispatch';
            const issueNumber = isDispatch
              ? Number(core.getInput('issue_number'))
              : context.payload.issue?.number;

            if (!issueNumber) {
              core.setOutput('should_run', 'false');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            const hasReadyLabel = labels.includes('2w:ready');
            const hasReadyTitle = issue.title.startsWith('2W_READY:');
            const isClosed = issue.state !== 'open';

            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_title', issue.title || '');
            core.setOutput('issue_body_b64', Buffer.from(issue.body || '', 'utf8').toString('base64'));

            if (isClosed || (!hasReadyLabel && !hasReadyTitle)) {
              core.setOutput('should_run', 'false');
              return;
            }

            core.setOutput('should_run', 'true');

  local_codex:
    name: Run local Codex CLI
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      changed_files: ${{ steps.diff.outputs.changed_files }}
      tests_status: ${{ steps.tests.outputs.tests_status }}
      codex_status: ${{ steps.codex.outputs.codex_status }}
    steps:
      - name: Mark issue running
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ needs.prepare.outputs.issue_number }}');
            const { owner, repo } = context.repo;
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: '2w:ready' }).catch(() => {});
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['2w:running'] }).catch(() => {});
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: '2W_RUNNING: local self-hosted runner started `codex exec` for this workblock.'
            });

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify local Codex CLI login
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v codex >/dev/null 2>&1; then
            echo "codex CLI not found on self-hosted runner PATH" >&2
            exit 127
          fi
          codex --version

      - name: Build Codex prompt
        shell: bash
        env:
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.prepare.outputs.issue_title }}
          ISSUE_BODY_B64: ${{ needs.prepare.outputs.issue_body_b64 }}
        run: |
          set -euo pipefail
          mkdir -p .2w
          printf '%s' "$ISSUE_BODY_B64" | base64 --decode > .2w/issue_body.md
          {
            printf '%s\n' '# 2W Workblock'
            printf '\n'
            printf '%s\n' 'You are Codex CLI running locally inside a self-hosted GitHub Actions runner.'
            printf '\n'
            printf '%s\n' '## Repository'
            printf '\n'
            printf '%s\n' "$GITHUB_REPOSITORY"
            printf '\n'
            printf '%s\n' '## Mandatory constraints'
            printf '\n'
            printf '%s\n' '- Keep the change as small as possible.'
            printf '%s\n' '- Work only inside this repository checkout.'
            printf '%s\n' '- Do not print secrets, tokens, environment variables, browser session data, or credential-bearing config.'
            printf '%s\n' '- Do not create branches or pull requests.'
            printf '%s\n' '- Do not commit or push yourself; leave file changes in the working tree for the workflow.'
            printf '%s\n' '- Prefer direct edits over new abstractions.'
            printf '%s\n' '- If the task is unsafe, ambiguous, or impossible, stop and write BLOCKED in `.2w/codex_final_message.md`.'
            printf '%s\n' '- End by writing a compact result summary to `.2w/codex_final_message.md` with STATUS, CHANGED_FILES, TESTS, RISKS, NEXT.'
            printf '\n'
            printf '%s\n' '## Source issue'
            printf 'Issue: #%s\n' "$ISSUE_NUMBER"
            printf 'Title: %s\n' "$ISSUE_TITLE"
            printf '\n'
            printf '%s\n' '## User workblock'
            cat .2w/issue_body.md
          } > .2w/current_prompt.md

      - name: Run local Codex CLI
        id: codex
        shell: bash
        run: |
          set +e
          codex exec --sandbox workspace-write --skip-git-repo-check --output-last-message .2w/codex_final_message.md "$(cat .2w/current_prompt.md)"
          rc=$?
          echo "codex_status=$rc" >> "$GITHUB_OUTPUT"
          if [ ! -f .2w/codex_final_message.md ]; then
            echo "STATUS: FAILED" > .2w/codex_final_message.md
            echo "CHANGED_FILES:" >> .2w/codex_final_message.md
            echo "TESTS: codex exec returned $rc before writing final message" >> .2w/codex_final_message.md
            echo "RISKS: local Codex CLI command, login, or flags may not match this runner" >> .2w/codex_final_message.md
            echo "NEXT: validate local codex exec command manually on the runner" >> .2w/codex_final_message.md
          fi
          exit "$rc"

      - name: Collect changed files
        id: diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .2w
          git status --short > .2w/git_status.txt
          grep -v '^?? .2w/' .2w/git_status.txt > .2w/changed_files.txt || true
          if [ -s .2w/changed_files.txt ]; then
            {
              echo 'changed_files<<EOF'
              cat .2w/changed_files.txt
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'changed_files=' >> "$GITHUB_OUTPUT"
          fi

      - name: Run repository checks when available
        id: tests
        shell: bash
        run: |
          set +e
          status="not_configured"
          if [ -f package.json ]; then
            npm test --if-present
            rc=$?
            if [ "$rc" -eq 0 ]; then status="green:npm-test"; else status="failed:npm-test:$rc"; fi
          elif [ -f pyproject.toml ] || [ -f pytest.ini ]; then
            python -m pytest
            rc=$?
            if [ "$rc" -eq 0 ]; then status="green:pytest"; else status="failed:pytest:$rc"; fi
          else
            status="not_configured:no-package-or-pytest"
            rc=0
          fi
          echo "tests_status=$status" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Commit and push changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git reset -- .2w || true
          if git diff --cached --quiet; then
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "2W: issue #${{ needs.prepare.outputs.issue_number }}"
          git push origin HEAD:${{ github.ref_name }}
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  report_success:
    name: Report success
    needs: [prepare, local_codex]
    if: needs.prepare.outputs.should_run == 'true' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Comment result
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ needs.local_codex.outputs.commit_sha }}
          CHANGED_FILES: ${{ needs.local_codex.outputs.changed_files }}
          TESTS_STATUS: ${{ needs.local_codex.outputs.tests_status }}
          CODEX_STATUS: ${{ needs.local_codex.outputs.codex_status }}
        with:
          script: |
            const issue_number = Number('${{ needs.prepare.outputs.issue_number }}');
            const { owner, repo } = context.repo;
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: '2w:running' }).catch(() => {});
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['2w:done'] }).catch(() => {});
            const body = [
              '2W_DONE',
              '',
              `repo=${owner}/${repo}`,
              `issue=#${issue_number}`,
              `commit=${process.env.COMMIT_SHA || 'none'}`,
              `tests=${process.env.TESTS_STATUS || 'unknown'}`,
              `codex_exit_code=${process.env.CODEX_STATUS || 'unknown'}`,
              '',
              'Changed files:',
              '```text',
              process.env.CHANGED_FILES || 'none',
              '```',
              '',
              'ChatGPT instruction: Prüfe Commit/Diff über GitHub und starte den nächsten 2W-Block oder einen FIX-Block.'
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  report_failure:
    name: Report failure
    needs: [prepare, local_codex]
    if: needs.prepare.outputs.should_run == 'true' && failure()
    runs-on: ubuntu-latest
    steps:
      - name: Comment failure
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number('${{ needs.prepare.outputs.issue_number }}');
            const { owner, repo } = context.repo;
            await github.rest.issues.removeLabel({ owner, repo, issue_number, name: '2w:running' }).catch(() => {});
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['2w:failed'] }).catch(() => {});
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: '2W_FAILED: local Codex CLI workflow failed. Prüfe GitHub Actions Logs auf dem self-hosted Runner. Wahrscheinliche Ursachen: `codex` nicht im PATH, lokaler Login fehlt, oder CLI-Flags passen nicht zur installierten Codex-Version.'
            });
