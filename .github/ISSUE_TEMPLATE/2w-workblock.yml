name: 2W Workblock

description: Minimaler Arbeitsblock für ChatGPT → Codex CLI → GitHub → ChatGPT

title: "2W_READY: "

labels:
  - 2w:ready

body:
  - type: markdown
    attributes:
      value: |
        Nutze diese Vorlage nur für kleine, überprüfbare 2W-Arbeitsblöcke.
        Ziel: Codex soll lokal über den self-hosted Runner arbeiten, Änderungen nicht selbst committen und am Ende eine kompakte Ergebnisnachricht liefern.

  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Was soll in diesem Arbeitsblock konkret erreicht werden?
      placeholder: "Beispiel: Ergänze eine README-Validierungssektion für den lokalen Runner."
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: Erlaubte Pfade
      description: Welche Dateien oder Ordner darf Codex ändern?
      placeholder: |
        README.md
        docs/
        .github/workflows/
    validations:
      required: true

  - type: textarea
    id: forbidden_paths
    attributes:
      label: Verbotene Pfade
      description: Welche Dateien oder Bereiche darf Codex nicht ändern?
      placeholder: |
        Keine Secrets
        Keine lokalen Runner-Konfigurationsdateien
        Keine Dateien außerhalb des Repository-Checkouts
    validations:
      required: true

  - type: textarea
    id: checks
    attributes:
      label: Erwartete Checks
      description: Welche Prüfungen sollen laufen?
      placeholder: |
        - YAML-Syntax prüfen
        - Markdown-Dateien auf Konsistenz prüfen
        - Kein Secret-Output
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      description: Wann ist der Arbeitsblock fertig?
      placeholder: |
        - Änderung ist klein und nachvollziehbar
        - Workflow bleibt self-hosted
        - Ergebnis wird als Issue-Kommentar gepostet
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Hinweise
      description: Zusätzliche Einschränkungen oder Kontext.
      placeholder: "Keine neue Engine, kein OperatorLoop, kein PR-Workflow."
    validations:
      required: false
